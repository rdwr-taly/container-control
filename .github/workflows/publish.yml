name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Version to publish (must match pyproject.toml)'
        required: true

jobs:
  build-and-publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/container-control/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify requested version
        run: |
          expected="${{ github.event.inputs.release-version }}"
          actual=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$expected" != "$actual" ]; then
            echo "Requested version '$expected' does not match pyproject.toml version '$actual'." >&2
            exit 1
          fi

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
